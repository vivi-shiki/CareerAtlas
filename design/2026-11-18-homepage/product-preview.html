e-columns{display:grid;grid-template-columns:1.8fr 1fr;gap:24px}.share-project h3{font-size:22px;margin-bottom:12px}.share-project .record{padding-top:14px;margin-top:14px}.share-project .record p{font-size:16px}.share-columns .mint{height:350px}.share-columns .question{margin-top:15px}.share-main .public-top{border:0;margin-bottom:20px;padding:0}.share-note{font-size:12px;color:#52615a;margin-top:15px}
