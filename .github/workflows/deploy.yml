name: Verify and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careeratlas
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: careeratlas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U careeratlas -d careeratlas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: careeratlas_test
      DB_USERNAME: careeratlas
      DB_PASSWORD: test-only-password
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, bcmath
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact
          vendor/bin/pint --test
      - run: npm ci
      - run: npm run build && npm run test:i18n && npm run test:docs
      - run: pwsh -NoProfile -File .github/Scripts/Validate-Documentation.ps1
      - run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          python3 deploy/test_extract.py

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, bcmath
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          npm ci
          npm run build
          bash deploy/package.sh "$GITHUB_SHA" "$RUNNER_TEMP/release.tar.gz"
      - name: Send verified release
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST_KEY" && test -n "$DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "careeratlas-deploy@$DEPLOY_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/release.tar.gz"
      - name: Verify public release
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$APP_URL"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$APP_URL/up" >/dev/null
          actual=$(curl -fsS "$APP_URL/deployment.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"])')
          test "$actual" = "$GITHUB_SHA"
          python3 deploy/check_docs.py "$APP_URL"
